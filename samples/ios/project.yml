# Generate the Xcode project with ./generate.sh (xcodegen); the .xcodeproj is not committed.
name: XrayKmpSample
options:
  bundleIdPrefix: org.example.xraykmp
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # The Kotlin framework is built for iosArm64 and iosSimulatorArm64 only.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
packages:
  XrayRustMobile:
    url: https://github.com/aimalygin/xray-rust-mobile
    # Keep equal to XRAY_RUST_MOBILE_VERSION in release/mobile.env (generate.sh checks it).
    exactVersion: 0.9.0
targets:
  App:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Xray KMP
        UILaunchScreen: {}
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        keychain-access-groups: ["$(AppIdentifierPrefix)org.example.xraykmp.shared"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.xraykmp
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../../xray-rust-kmp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "XrayRustKmp"]
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          ./gradlew :xray-rust-kmp:embedAndSignAppleFrameworkForXcode
    dependencies:
      - target: PacketTunnel
      # Pure Swift: XrayVlessURLImporter and XrayKeychainConfigStore; no xray core in the app target.
      - package: XrayRustMobile
        product: XrayAppleShared
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources: [PacketTunnel]
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: Xray KMP Tunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        keychain-access-groups: ["$(AppIdentifierPrefix)org.example.xraykmp.shared"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.xraykmp.PacketTunnel
    dependencies:
      - package: XrayRustMobile
        product: XrayAppleTunnel
schemes:
  App:
    build:
      targets:
        App: all
