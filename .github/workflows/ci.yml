name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # One macOS job: the iOS klibs, the framework and the Xcode sample need macOS anyway,
    # and the Android library and sample build there too.
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Select JDK 21
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_arm64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_arm64/bin" >> "$GITHUB_PATH"

      - name: Build library, run common tests, verify pinned AAR
        run: ./gradlew --no-daemon :xray-rust-kmp:build

      - name: Link iOS frameworks against the pinned XCFramework
        run: |
          ./gradlew --no-daemon \
            :xray-rust-kmp:linkDebugFrameworkIosArm64 \
            :xray-rust-kmp:linkDebugFrameworkIosSimulatorArm64

      - name: Assemble Android sample
        run: ./gradlew --no-daemon :samples:android:assembleDebug

      - name: Install checksum-verified XcodeGen
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          archive="$RUNNER_TEMP/xcodegen.zip"
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 --retry 3 \
            --output "$archive" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  ${archive}" | shasum -a 256 --check -
          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Build iOS sample (app + packet tunnel extension, unsigned)
        run: |
          samples/ios/generate.sh
          xcodebuild -project samples/ios/XrayKmpSample.xcodeproj -scheme App \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            build CODE_SIGNING_ALLOWED=NO
